name: Build Windows x64

# Manual trigger + on tag pushes. Add `push: branches: [dev]` if you want
# it to run on every commit too, but be aware this build is heavy (it
# compiles Qt6, OpenSSL, WebRTC, etc. from source) and can take 1.5-3+
# hours even with caching, which is a large chunk of the free 2000
# GitHub Actions minutes/month on private repos.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  # Matches docs/building-win.md. NOTE: that doc calls for Visual Studio
  # 2026 with the 10.0.26100.0 SDK. windows-2022/windows-2025 hosted
  # runners currently ship VS2022, which may or may not be new enough -
  # if the configure/build step below fails on toolset detection, that's
  # the first thing to check (see the troubleshooting note at the bottom).
  BUILD_PATH: D:\TBuild
  TDESKTOP_API_ID: "32396611"
  TDESKTOP_API_HASH: "9d9c0ee37bb8b3a29800bfc630a565ea"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Prepare BuildPath layout
        shell: cmd
        run: |
          mkdir "%BUILD_PATH%"
          mkdir "%BUILD_PATH%\ThirdParty"
          mkdir "%BUILD_PATH%\Libraries"

      - name: Checkout AraGram source (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: _src

      # tdesktop's own build scripts expect the repo to live directly
      # under BuildPath (see docs/building-win.md), so move the checkout
      # there instead of building in the default GITHUB_WORKSPACE path.
      - name: Move source into BuildPath\tdesktop
        shell: cmd
        run: |
          move "%GITHUB_WORKSPACE%\_src" "%BUILD_PATH%\tdesktop"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Caches the compiled third-party libraries (Qt6, OpenSSL, WebRTC,
      # etc.) keyed on the prepare scripts + submodule commit list, so
      # only the first run (or a dependency bump) pays the full cost.
      - name: Cache ThirdParty/Libraries
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_PATH }}\ThirdParty
            ${{ env.BUILD_PATH }}\Libraries
          key: aragram-win-libs-${{ hashFiles('D:/TBuild/tdesktop/Telegram/build/prepare/**') }}

      - name: Prepare third-party libraries
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44 || ^
          call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44 || ^
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44
          cd /d "%BUILD_PATH%\tdesktop"
          call Telegram\build\prepare\win.bat

      - name: Configure project
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44 || ^
          call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44 || ^
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44
          cd /d "%BUILD_PATH%\tdesktop\Telegram"
          configure.bat x64 -D TDESKTOP_API_ID=%TDESKTOP_API_ID% -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH%

      - name: Build (Release)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44 || ^
          call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44 || ^
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44
          cmake --build "%BUILD_PATH%\tdesktop\out" --config Release --target Telegram -- /m

      - name: Locate build output
        shell: cmd
        run: |
          dir /s /b "%BUILD_PATH%\tdesktop\out\Release\AraGram.exe"

      - name: Upload AraGram.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: AraGram-windows-x64
          path: |
            ${{ env.BUILD_PATH }}\tdesktop\out\Release\AraGram.exe
          if-no-files-found: error
          retention-days: 14

# Troubleshooting:
# - "toolset not found" / vcvars errors: the three `call ... || call ...`
#   chains above try Enterprise, then Community, then Build Tools editions
#   of VS2022. If none of those paths exist on the runner image in use,
#   check the current image's installed VS path and adjust.
# - libvpx build failures: downgrade NASM to 3.01 (see docs/building-win.md).
# - PDB "API call failed": apply the options_win.cmake / variables.cmake
#   patch documented in docs/building-win.md before the Configure step.
# - This workflow builds Release only. Add a matching Debug leg if needed.
